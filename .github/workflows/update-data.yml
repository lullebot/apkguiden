name: Uppdatera produktdata

on:
  schedule:
    # Måndagar kl 06:00 UTC (07:00 svensk tid på vintern, 08:00 på sommaren).
    # Veckovis = lågprofil mot Systembolaget, sortimentet uppdateras
    # ändå bara fyra gånger om året enligt dem själva.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta och processa sortimentet
        run: python scripts/update-data.py

      - name: Committa uppdaterad data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html (statisk SEO-text + JSON-LD) och sitemap.xml (lastmod)
          # skrivs om av update-data.py och måste därför committas med.
          git add data.json search-data.json index.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Ingen förändring i datan – inget att committa."
          else
            git commit -m "🍷 Uppdatera produktdata $(date -u +%Y-%m-%d)"
            # Om någon hunnit pusha till main under körningen (den tar ~6 min)
            # lägger vi vår commit ovanpå deras istället för att misslyckas.
            git pull --rebase origin main
            git push
          fi
